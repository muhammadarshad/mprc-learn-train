[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mprc-structural-learning"
version = "0.1.0"
description = "Empirical MPRC structural-learning experiments: W^2/B^1 LUT learning, Arshad's ViT, and VOF ablations"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
