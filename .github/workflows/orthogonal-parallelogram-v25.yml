name: Orthogonal Parallelogram Construction v25

on:
  push:
    branches: [master]
    paths:
      - 'docs/V25_ORTHOGONAL_PARALLELOGRAM_CONSTRUCTION.md'
      - 'scripts/orthogonal_parallelogram_v25.py'
      - 'scripts/wave_encoder_torch.py'
      - '.github/workflows/orthogonal-parallelogram-v25.yml'
  workflow_dispatch:

jobs:
  construction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          pip install numpy pillow
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Sparse checkout Fruits-360 factor cross
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/fruits-360/fruits-360-100x100.git \
            data/fruits360
          cd data/fruits360
          git sparse-checkout set \
            "Training/Orange 1" \
            "Training/Limes 1" \
            "Training/Pepper Orange 1" \
            "Training/Pepper Green 1" \
            "Test/Orange 1" \
            "Test/Limes 1" \
            "Test/Pepper Orange 1" \
            "Test/Pepper Green 1"

      - name: Run v25 constructive gate
        run: |
          PYTHONPATH=. python scripts/orthogonal_parallelogram_v25.py \
            --root data/fruits360 \
            --json results/v25_orthogonal_parallelogram.json \
            --png results/v25_orthogonal_parallelogram.png

      - uses: actions/upload-artifact@v4
        with:
          name: orthogonal-parallelogram-v25
          path: |
            results/v25_orthogonal_parallelogram.json
            results/v25_orthogonal_parallelogram.png
          retention-days: 90
