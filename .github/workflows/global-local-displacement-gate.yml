name: Global Local Displacement survival gate

on:
  push:
    branches: [master]
    paths:
      - 'scripts/global_local_displacement_survival_gate.py'
      - '.github/workflows/global-local-displacement-gate.yml'
  workflow_dispatch:

jobs:
  prove-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/global_local_displacement_survival_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: global-local-displacement-survival-gate
          path: results/global_local_displacement_survival_gate.json
          retention-days: 90
