name: v31 feature channel specialization
on:
  push:
    branches: [master]
    paths:
      - 'scripts/v31_feature_channel_specialization.py'
      - '.github/workflows/v31-feature-channel-specialization.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python gates/gate_arshads_vit_pretraining.py
      - run: PYTHONPATH=src python scripts/v31_feature_channel_specialization.py
      - uses: actions/upload-artifact@v4
        with:
          name: v31-feature-channel-specialization
          path: results/v31_feature_channel_specialization.json
          retention-days: 90
