name: MPRC Vision CIFAR position displacement Arm8

on:
  push:
    branches: [master]
    paths:
      - 'scripts/mprc_vision_cifar_position_displacement_arm8.py'
      - 'scripts/position_displacement_arm8_survival_gate.py'
      - '.github/workflows/mprc-vision-cifar-position-displacement-arm8.yml'
  workflow_dispatch:

jobs:
  gate-then-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PRE-TRAINING POSITION-DISPLACEMENT-CONTEXT GATE
        run: python scripts/position_displacement_arm8_survival_gate.py

      - name: Install training dependency
        run: pip install numpy

      - name: TRAIN ONLY AFTER GATE PASS
        run: python scripts/mprc_vision_cifar_position_displacement_arm8.py

      - uses: actions/upload-artifact@v4
        with:
          name: mprc-vision-cifar-position-displacement-arm8-result
          path: |
            results/position_displacement_arm8_survival_gate.json
            results/mprc_vision_cifar_position_displacement_arm8.json
          retention-days: 90
