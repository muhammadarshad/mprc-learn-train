name: Local Global Transpose Gate

on:
  push:
    branches: [master]
    paths:
      - 'scripts/local_global_transpose_survival_gate.py'
      - '.github/workflows/local-global-transpose-gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local-global transpose survival gate
        run: python scripts/local_global_transpose_survival_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: local-global-transpose-gate
          path: results/local_global_transpose_survival_gate.json
          retention-days: 90
