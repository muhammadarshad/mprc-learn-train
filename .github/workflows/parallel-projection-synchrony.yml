name: Parallel projection synchrony gate
on:
  push:
    branches: [master]
    paths:
      - 'src/mprc_structural/parallel_projection.py'
      - 'gates/gate_parallel_projection.py'
      - 'tests/test_parallel_projection.py'
      - '.github/workflows/parallel-projection-synchrony.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pytest
      - run: PYTHONPATH=src python gates/gate_parallel_projection.py
      - run: PYTHONPATH=src pytest -q tests/test_parallel_projection.py
