name: MPRC Global Attention Probe

on:
  push:
    branches: [master]
    paths:
      - 'src/mprc_structural/global_attention.py'
      - 'tests/test_global_attention.py'
      - 'scripts/local_global_transpose_survival_gate.py'
      - 'scripts/global_attention_probe.py'
      - '.github/workflows/global-attention-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test runner
        run: pip install -e . pytest

      - name: PRE-PROBE local-global transpose gate
        run: python scripts/local_global_transpose_survival_gate.py

      - name: Global attention indexing tests
        run: python -m pytest -q tests/test_global_attention.py

      - name: Global Attention probe
        run: python scripts/global_attention_probe.py

      - uses: actions/upload-artifact@v4
        with:
          name: global-attention-probe
          path: |
            results/local_global_transpose_survival_gate.json
            results/global_attention_probe.json
          retention-days: 90
