name: Position Displacement Arm8 survival gate

on:
  push:
    branches: [master]
    paths:
      - 'scripts/position_displacement_arm8_survival_gate.py'
      - '.github/workflows/position-displacement-arm8-gate.yml'
  workflow_dispatch:

jobs:
  prove-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/position_displacement_arm8_survival_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: position-displacement-arm8-survival-gate
          path: results/position_displacement_arm8_survival_gate.json
          retention-days: 90
