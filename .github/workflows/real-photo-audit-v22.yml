name: Real Photo Factor Audit v22

on:
  push:
    branches: [master]
    paths:
      - 'scripts/real_photo_factor_audit_v22.py'
      - '.github/workflows/real-photo-audit-v22.yml'
  workflow_dispatch:

jobs:
  raw-photo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy

      - name: Sparse checkout Fruits-360 factor cross
        run: |
          git clone --depth 1 --filter=blob:none --sparse             https://github.com/fruits-360/fruits-360-100x100.git             data/fruits360
          cd data/fruits360
          git sparse-checkout set             "Training/Orange 1"             "Training/Limes 1"             "Training/Pepper Orange 1"             "Training/Pepper Green 1"             "Test/Orange 1"             "Test/Limes 1"             "Test/Pepper Orange 1"             "Test/Pepper Green 1"

      - name: Build real-photo audit sheet
        run: |
          mkdir -p results
          python scripts/real_photo_factor_audit_v22.py             --root data/fruits360             --png results/v22_real_photo_audit.png             --json results/v22_real_photo_audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: real-photo-audit-v22
          path: |
            results/v22_real_photo_audit.png
            results/v22_real_photo_audit.json
          retention-days: 90
