name: CIFAR A0 capacity-aligned 113x16 accuracy gate
on:
  push:
    branches: [master]
    paths:
      - 'scripts/cifar_a0_capacity113.py'
      - '.github/workflows/cifar-a0-capacity113.yml'
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python gates/gate_bit_manifold.py
      - run: PYTHONPATH=src python scripts/cifar_a0_capacity113.py
      - uses: actions/upload-artifact@v4
        with:
          name: cifar-a0-capacity113
          path: results/cifar_a0_capacity113.json
          retention-days: 90
