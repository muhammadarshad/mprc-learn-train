name: Local Relation16 Transpose Gate

on:
  push:
    branches: [master]
    paths:
      - 'src/mprc_structural/global_attention.py'
      - 'scripts/local_relation16_transpose_gate.py'
      - '.github/workflows/local-relation16-transpose-gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 16x16 relation transpose gate
        run: python scripts/local_relation16_transpose_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: local-relation16-transpose-gate
          path: results/local_relation16_transpose_gate.json
          retention-days: 90
