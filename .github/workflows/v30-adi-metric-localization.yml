name: v30 ADI metric localization
on:
  push:
    branches: [master]
    paths:
      - 'scripts/v30_adi_metric_localization.py'
      - '.github/workflows/v30-adi-metric-localization.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python gates/gate_arshads_vit_pretraining.py
      - run: PYTHONPATH=src python scripts/v30_adi_metric_localization.py
      - uses: actions/upload-artifact@v4
        with:
          name: v30-adi-metric-localization
          path: results/v30_adi_metric_localization.json
          retention-days: 90
