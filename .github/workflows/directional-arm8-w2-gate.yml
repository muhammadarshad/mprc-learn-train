name: Directional Arm8 W2 survival gate

on:
  push:
    branches: [master]
    paths:
      - 'scripts/directional_arm8_w2_survival_gate.py'
      - '.github/workflows/directional-arm8-w2-gate.yml'
  workflow_dispatch:

jobs:
  prove-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/directional_arm8_w2_survival_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: directional-arm8-w2-survival-gate
          path: results/directional_arm8_w2_survival_gate.json
          retention-days: 90
