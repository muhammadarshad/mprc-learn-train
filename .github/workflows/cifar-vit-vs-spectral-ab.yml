name: CIFAR ViT vs spectral strict AB
on:
  push:
    branches: [master]
    paths:
      - 'scripts/cifar_vit_vs_spectral_ab.py'
      - '.github/workflows/cifar-vit-vs-spectral-ab.yml'
  workflow_dispatch:
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python scripts/cifar_vit_vs_spectral_ab.py
      - uses: actions/upload-artifact@v4
        with:
          name: cifar-vit-vs-spectral-ab
          path: results/cifar_vit_vs_spectral_ab.json
          retention-days: 90
