name: MPRC Vision CIFAR v1 directional 1+8

on:
  push:
    branches: [master]
    paths:
      - 'scripts/mprc_vision_cifar_v1.py'
      - '.github/workflows/mprc-vision-cifar-v1.yml'
  workflow_dispatch:

jobs:
  train-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python scripts/mprc_vision_cifar_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: mprc-vision-cifar-v1-result
          path: results/mprc_vision_cifar_v1.json
          retention-days: 90
