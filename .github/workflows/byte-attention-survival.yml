name: Corrected byte-state attention survival
on:
  push:
    branches: [master]
    paths:
      - 'src/mprc_structural/byte_attention.py'
      - 'gates/gate_byte_attention.py'
      - '.github/workflows/byte-attention-survival.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python gates/gate_bit_manifold.py
      - run: PYTHONPATH=src python gates/gate_byte_attention.py
