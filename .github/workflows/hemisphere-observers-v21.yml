name: Hemisphere Orthogonal Observers v21

on:
  push:
    branches: [master]
    paths:
      - 'scripts/hemisphere_orthogonal_observers_v21.py'
      - '.github/workflows/hemisphere-observers-v21.yml'
  workflow_dispatch:

jobs:
  orthogonal-observers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e . pillow

      - name: Sparse checkout real Fruits-360 factor cross
        run: |
          git clone --depth 1 --filter=blob:none --sparse             https://github.com/fruits-360/fruits-360-100x100.git             data/fruits360
          cd data/fruits360
          git sparse-checkout set             "Training/Orange 1"             "Training/Limes 1"             "Training/Pepper Orange 1"             "Training/Pepper Green 1"             "Test/Orange 1"             "Test/Limes 1"             "Test/Pepper Orange 1"             "Test/Pepper Green 1"

      - name: Run MPRC hemisphere-aware factor observers
        run: |
          python scripts/hemisphere_orthogonal_observers_v21.py             --root data/fruits360             --out results/hemisphere_orthogonal_observers_v21.json

      - uses: actions/upload-artifact@v4
        with:
          name: hemisphere-observers-v21
          path: results/hemisphere_orthogonal_observers_v21.json
          retention-days: 90
