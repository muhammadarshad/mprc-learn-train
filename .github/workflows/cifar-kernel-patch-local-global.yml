name: CIFAR kernel patch local global audit
on:
  push:
    branches: [master]
    paths:
      - 'scripts/cifar_kernel_patch_local_global.py'
      - '.github/workflows/cifar-kernel-patch-local-global.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy
      - run: PYTHONPATH=src python gates/gate_bit_manifold.py
      - run: PYTHONPATH=src python scripts/cifar_kernel_patch_local_global.py
      - uses: actions/upload-artifact@v4
        with:
          name: cifar-kernel-patch-local-global
          path: results/cifar_kernel_patch_local_global.json
          retention-days: 90
