name: GEN 7-8-9 Structural Ladder RC1

on:
  push:
    branches: [master]
    paths:
      - 'docs/GEN789_STRUCTURAL_LADDER_RC1.md'
      - 'scripts/gen789_structural_ladder_gate.py'
      - '.github/workflows/gen789-ladder-rc1.yml'
  workflow_dispatch:

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run GEN 7-8-9 structural ladder gate
        run: python scripts/gen789_structural_ladder_gate.py

      - uses: actions/upload-artifact@v4
        with:
          name: gen789-ladder-rc1
          path: results/gen789_structural_ladder_rc1.json
          retention-days: 90
