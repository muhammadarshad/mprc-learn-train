name: Scalar vs Directional4 Learning v2

on:
  push:
    branches: [master]
    paths:
      - 'scripts/integer_learning_rate_gate.py'
      - 'scripts/local_global_transpose_survival_gate.py'
      - 'scripts/local_relation16_transpose_gate.py'
      - 'scripts/scalar_vs_directional4_learning_v2.py'
      - '.github/workflows/scalar-vs-directional4-v2.yml'
  workflow_dispatch:

jobs:
  directional:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Gate rational integer learner
        run: python scripts/integer_learning_rate_gate.py
      - name: Gate local-global transpose
        run: python scripts/local_global_transpose_survival_gate.py
      - name: Gate Relation16 transpose
        run: python scripts/local_relation16_transpose_gate.py
      - name: Compare scalar and directional learning
        run: python scripts/scalar_vs_directional4_learning_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: scalar-vs-directional4-v2
          path: |
            results/integer_learning_rate_gate.json
            results/local_global_transpose_survival_gate.json
            results/local_relation16_transpose_gate.json
            results/scalar_vs_directional4_learning_v2.json
          retention-days: 90
